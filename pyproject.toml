[project]
name = "llamaindex-proyecto"
version = "0.1.0"
description = "Sistema de IA basado en LlamaIndex para análisis y procesamiento de documentos"
authors = [
    {name = "dlezcanob",email = "david.lezcano@usil.pe"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "llama-index-core (>=0.12.0)",
    "llama-index-llms-gemini (>=0.6.2,<0.7.0)",
    "llama-index-embeddings-gemini (>=0.4.2,<0.5.0)",
    "llama-index-readers-file (>=0.7.0,<0.8.0)",
    "pymupdf (>=1.28.2,<2.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "google-genai (>=2.25.0,<3.0.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt (<4.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "tenacity (>=9.1.4,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"




[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
